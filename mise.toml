#:schema https://mise.jdx.dev/schema/mise.json

[tools]
node = "26"
prek = "0.5.7"
uv = "0.12.10"

"pipx:ansible-core" = { version = "2.21.5", uvx_args = "--with docker --with requests" }
"pipx:ansible-doctor" = { version= "8.4.3", uvx_args = "--with ansible-core" }
"pipx:ansible-lint" = "26.10.1"
"pipx:molecule" = { version = "26.10.0", uvx_args = "--with molecule-hetznercloud --with molecule-plugins[docker] --with pytest --with pytest-testinfra --with-executables-from pytest" }
